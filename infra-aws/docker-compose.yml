services:
  postgres:
    image: postgres:16-alpine
    restart: always
    environment:
      POSTGRES_DB: speckle
      POSTGRES_USER: speckle
      POSTGRES_PASSWORD: speckle
    volumes:
      - postgres-data:/var/lib/postgresql/data
    command: postgres -c max_prepared_transactions=150

  redis:
    image: valkey/valkey:8.1-alpine
    restart: always
    volumes:
      - redis-data:/data

  minio:
    image: quay.io/minio/minio
    restart: always
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    volumes:
      - minio-data:/data

  speckle-server:
    image: speckle/speckle-server:latest
    restart: always
    ports:
      - '0.0.0.0:3000:3000'
    depends_on:
      - postgres
      - redis
      - minio
    env_file:
      - ./server.env

  ifc-import-service:
    image: speckle/speckle-ifc-import-service:2.31.15-alpha.1277
    restart: always
    environment:
      LOG_LEVEL: 'info'
      LOG_PRETTY: 'true'
      FILEIMPORT_QUEUE_POSTGRES_URL: 'postgresql://speckle:speckle@postgres/speckle'
    depends_on:
      - speckle-server
      - postgres

  caddy:
    image: caddy:2-alpine
    restart: always
    ports:
      - '0.0.0.0:80:80'
      - '0.0.0.0:443:443'
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile
      - caddy-data:/data
      - caddy-config:/config
    depends_on:
      - speckle-server

volumes:
  postgres-data:
  redis-data:
  minio-data:
  caddy-data:
  caddy-config:
