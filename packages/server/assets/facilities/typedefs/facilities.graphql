# COBie-inspired asset registry: Facility (1:1 with this Project) -> Floor ->
# Space, with Asset (COBie "Component") optionally linked to a Space and to
# one or more AssetSystems, and optionally typed by an AssetType drawn from
# the server-wide catalog.
extend type Project {
  """
  The COBie-style facility registry for this project. Null until the first
  floor/space/system/asset is registered for it.
  """
  facility: Facility
}

type Facility {
  id: String!
  projectId: String!
  name: String!
  """
  Which IFC property is read as an asset's tag number when linking it to a
  model element (e.g. "IfcTag", "IfcName", or a custom Pset property).
  """
  tagSourceProperty: String!
  floors: [Floor!]!
  spaces(input: GetFacilitySpacesInput): [Space!]!
  systems: [AssetSystem!]!
  assets(input: GetFacilityAssetsInput): AssetCollection!
  createdAt: DateTime!
  updatedAt: DateTime!
}

type Floor {
  id: String!
  facilityId: String!
  name: String!
  """
  Real-world elevation in meters, when known.
  """
  elevationZ: Float
  spaces: [Space!]!
  createdAt: DateTime!
  updatedAt: DateTime!
}

type Space {
  id: String!
  facilityId: String!
  floorId: String
  floor: Floor
  name: String!
  """
  Real-world elevation in meters - always worth capturing even without a
  Floor, e.g. read from the linked IfcSpace element's geometry.
  """
  elevationZ: Float
  """
  Id of the BIM element (e.g. an IfcSpace) this space is linked to, if any.
  """
  speckleObjectId: String
  assets(input: GetFacilityAssetsInput): AssetCollection!
  createdAt: DateTime!
  updatedAt: DateTime!
}

input GetFacilitySpacesInput {
  floorId: String
}

enum AssetTypeNature {
  fixed
  movable
}

"""
The COBie "Type" sheet - a shared, server-wide equipment catalog (e.g.
"12,000 BTU split AC, Manufacturer X, Model Y"), reused across facilities.
Only server admins can create or edit catalog entries.
"""
type AssetType {
  id: String!
  name: String!
  category: String
  manufacturer: String
  modelNumber: String
  nature: AssetTypeNature
  description: String
  expectedLifeYears: Int
  """
  Any other COBie Type attribute (warranty, dimensions, material, etc.) or
  custom attribute that doesn't have its own column.
  """
  extendedAttributes: JSONObject!
  createdAt: DateTime!
  updatedAt: DateTime!
}

type AssetTypeCollection {
  totalCount: Int!
  cursor: String
  items: [AssetType!]!
}

extend type Query {
  assetTypes(limit: Int = 25, cursor: String, search: String): AssetTypeCollection!
  assetType(id: String!): AssetType
}

input CreateAssetTypeInput {
  name: String!
  category: String
  manufacturer: String
  modelNumber: String
  nature: AssetTypeNature
  description: String
  expectedLifeYears: Int
  extendedAttributes: JSONObject
}

input UpdateAssetTypeInput {
  id: String!
  name: String
  category: String
  manufacturer: String
  modelNumber: String
  nature: AssetTypeNature
  description: String
  expectedLifeYears: Int
  extendedAttributes: JSONObject
}

type AssetTypeMutations {
  create(input: CreateAssetTypeInput!): AssetType!
  update(input: UpdateAssetTypeInput!): AssetType!
  delete(id: String!): Boolean!
}

extend type Mutation {
  """
  Manage the shared AssetType catalog. Server-admin only.
  """
  assetTypeMutations: AssetTypeMutations! @hasServerRole(role: SERVER_ADMIN)
}

"""
The COBie "System" sheet - a functional grouping of assets (e.g. "Sistema
de Climatização 1"), scoped to one facility. An asset can belong to more
than one system.
"""
type AssetSystem {
  id: String!
  facilityId: String!
  name: String!
  description: String
  assets(input: GetFacilityAssetsInput): AssetCollection!
  createdAt: DateTime!
  updatedAt: DateTime!
}

"""
The COBie "Component" sheet - one physical asset instance, identified
within its facility by a human-assigned tag number (not the IFC GUID,
which the exporting tool may not keep stable across re-exports).
"""
type Asset {
  id: String!
  facilityId: String!
  """
  Stable identity within the facility - usually read from the linked BIM
  element's IfcTag/IfcName property. Unique per facility.
  """
  tagNumber: String!
  name: String
  assetTypeId: String
  assetType: AssetType
  spaceId: String
  space: Space
  systems: [AssetSystem!]!
  """
  Cache of where this asset currently resolves to in the model - refreshed
  whenever a new model version is reconciled against this asset's tag.
  """
  currentObjectId: String
  currentVersionId: String
  createdAt: DateTime!
  updatedAt: DateTime!
}

type AssetCollection {
  totalCount: Int!
  cursor: String
  items: [Asset!]!
}

input GetFacilityAssetsInput {
  limit: Int = 25
  cursor: String
  spaceId: String
  systemId: String
  search: String
}

input UpdateFacilityInput {
  projectId: String!
  name: String
  tagSourceProperty: String
}

input CreateFloorInput {
  projectId: String!
  name: String!
  elevationZ: Float
}

input UpdateFloorInput {
  id: String!
  name: String
  elevationZ: Float
}

input CreateSpaceInput {
  projectId: String!
  name: String!
  floorId: String
  elevationZ: Float
  speckleObjectId: String
}

input UpdateSpaceInput {
  id: String!
  name: String
  floorId: String
  elevationZ: Float
  speckleObjectId: String
}

input CreateAssetSystemInput {
  projectId: String!
  name: String!
  description: String
}

input UpdateAssetSystemInput {
  id: String!
  name: String
  description: String
}

input CreateAssetInput {
  projectId: String!
  tagNumber: String!
  name: String
  assetTypeId: String
  spaceId: String
  systemIds: [String!]
}

input UpdateAssetInput {
  id: String!
  tagNumber: String
  name: String
  assetTypeId: String
  spaceId: String
  systemIds: [String!]
}

type FacilityMutations {
  update(input: UpdateFacilityInput!): Facility!

  createFloor(input: CreateFloorInput!): Floor!
  updateFloor(input: UpdateFloorInput!): Floor!
  deleteFloor(id: String!): Boolean!

  createSpace(input: CreateSpaceInput!): Space!
  updateSpace(input: UpdateSpaceInput!): Space!
  deleteSpace(id: String!): Boolean!

  createSystem(input: CreateAssetSystemInput!): AssetSystem!
  updateSystem(input: UpdateAssetSystemInput!): AssetSystem!
  deleteSystem(id: String!): Boolean!

  createAsset(input: CreateAssetInput!): Asset!
  updateAsset(input: UpdateAssetInput!): Asset!
  deleteAsset(id: String!): Boolean!
}

extend type Mutation {
  """
  Manage a project's facility registry (floors, spaces, systems, assets).
  Requires publish access to the target project.
  """
  facilityMutations: FacilityMutations! @hasServerRole(role: SERVER_GUEST)
}
