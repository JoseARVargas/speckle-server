# OFFICIO Coordenação BIM - segunda pilha na mesma VPS do NexTwin (plano
# speckle-digitaltwin-console/.ai/plans/2026-10-04-officio-coordenacao-produto.md, opção 1).
# Banco, MinIO, segredos e backup próprios; mesma imagem do servidor, com o
# módulo de digital twin desligado (FF_FACILITIES_MODULE_ENABLED=false).
# Sem portas: o Caddy da pilha nextwin publica 80/443 e chega aqui pela rede
# "edge" (docker network create edge), pelos aliases officio-*.
name: officio

services:
  postgres:
    image: postgres:16-alpine@sha256:721873c34ceb9f8d8fc265984940dc982404c105f19ad51be9fdc5970a6080ea
    restart: always
    environment:
      POSTGRES_DB: speckle
      POSTGRES_USER: speckle
    env_file:
      - ./secrets/postgres.env
    volumes:
      - postgres-data:/var/lib/postgresql/data
    command: postgres -c max_prepared_transactions=150
    mem_limit: 384m
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U speckle -d speckle']
      interval: 10s
      timeout: 5s
      retries: 10

  redis:
    image: valkey/valkey:8.1-alpine@sha256:081c2f5cb575efc901aa80ff9cdbd1ec6a301682fd35e1ebb4b0990a4a4a8507
    restart: always
    volumes:
      - redis-data:/data
    mem_limit: 64m

  minio:
    # Mesma imagem local da pilha nextwin (copiada da EC2); nunca buscar de fora.
    image: quay.io/minio/minio:latest
    pull_policy: never
    restart: always
    command: server /data
    env_file:
      - ./secrets/minio.env
    volumes:
      - minio-data:/data
    mem_limit: 256m
    networks:
      default:
      edge:
        aliases: [officio-minio]

  speckle-server:
    image: ghcr.io/josearvargas/speckle-server:b52b7887ff
    restart: always
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_started
      minio:
        condition: service_started
    env_file:
      - ./config/server.env
      - ./secrets/server.env
    mem_limit: 768m
    networks:
      default:
      edge:
        aliases: [officio-speckle-server]

  speckle-frontend-2:
    image: speckle/speckle-frontend-2:2.31.14@sha256:0becacf171acd8e566b8cf6ff6884bc2a433a0d2828ab145c54ea163f9a91276
    restart: always
    environment:
      NUXT_PUBLIC_SERVER_NAME: 'OFFICIO'
      NUXT_PUBLIC_API_ORIGIN: 'https://speckle.officio.net.br'
      NUXT_PUBLIC_BASE_URL: 'https://speckle.officio.net.br'
      NUXT_PUBLIC_BACKEND_API_ORIGIN: 'http://speckle-server:3000'
      NUXT_REDIS_URL: 'redis://redis:6379'
      LOG_LEVEL: 'info'
    depends_on:
      - speckle-server
      - redis
    mem_limit: 384m
    networks:
      default:
      edge:
        aliases: [officio-speckle-frontend-2]

  ifc-import-service:
    image: speckle/speckle-ifc-import-service:2.31.15-alpha.1277@sha256:a8a67cceafcd50974761bfd6825d7570b3533d2f00a83b199e128c941a5fcfc8
    restart: always
    environment:
      LOG_LEVEL: 'info'
    env_file:
      - ./secrets/ifc-import.env
    depends_on:
      postgres:
        condition: service_healthy
      speckle-server:
        condition: service_started
    # IFCs de ~60 MB passam de 1 GB na conversão (OOM em 2026-10-05). No KVM 1 o excedente vai
    # para a swap: mais lento, mas não mata o processo (memswap = memória + swap permitida).
    mem_limit: 2560m
    memswap_limit: 5g

  coord-worker:
    # Validação IDS (IfcTester) e geometria do clash (IfcOpenShell). Sem portas; usuário Postgres
    # restrito e chave S3 só de leitura. O clash pode passar de 1 GB em modelos grandes: memória
    # extra vai para a swap (mais lento, sem matar o processo).
    image: ghcr.io/josearvargas/coord-worker:d1d8826dc0
    restart: always
    depends_on:
      postgres:
        condition: service_healthy
      minio:
        condition: service_started
    environment:
      S3_ENDPOINT: http://minio:9000
      S3_BUCKET: speckle-server
    env_file:
      - ./secrets/coord-worker.env
    mem_limit: 2560m
    memswap_limit: 5g
    cpus: 1.0
    read_only: true
    tmpfs:
      - /tmp

networks:
  edge:
    external: true

volumes:
  postgres-data:
  redis-data:
  minio-data:
